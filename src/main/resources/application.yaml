spring:
  application:
    name: tarbank
  datasource:
    url: ${tarbank.database.url}
    username: ${tarbank.database.username}
    password: ${tarbank.database.password}
    hikari:
      pool-name: tarbank-postgresql-pool
  data:
    redis:
      host: ${tarbank.redis.host}
      port: ${tarbank.redis.port}
      password: ${tarbank.redis.password}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

management:
  server:
    address: 127.0.0.1
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,tarbankPostgres,tarbankRedis
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.99
  prometheus:
    metrics:
      export:
        enabled: ${TARBANK_PROMETHEUS_ENABLED:false}
  tracing:
    enabled: true
    sampling:
      probability: ${TARBANK_TRACING_SAMPLING_PROBABILITY:1.0}

tarbank:
  database:
    url: ${TARBANK_DATABASE_URL}
    username: ${TARBANK_DATABASE_USERNAME}
    password: ${TARBANK_DATABASE_PASSWORD}
  redis:
    host: ${TARBANK_REDIS_HOST}
    port: ${TARBANK_REDIS_PORT:6379}
    password: ${TARBANK_REDIS_PASSWORD}
  jwt:
    issuer: tarbank
    signing-key: ${TARBANK_JWT_SIGNING_KEY:}
    access-token-ttl: PT1H
  document-protection:
    key-version: v1
    encryption-key: ${TARBANK_DOCUMENT_ENCRYPTION_KEY:}
    lookup-hmac-key: ${TARBANK_DOCUMENT_LOOKUP_HMAC_KEY:}
  idempotency:
    retention: PT24H
    lock-timeout: PT5S
    request-fingerprint-hmac-key: ${TARBANK_IDEMPOTENCY_FINGERPRINT_HMAC_KEY:}
  failure-simulator:
    enabled: false
    failure-rate: 0.0
    allowed-points:
      - BEFORE_TRANSACTION
      - DURING_TRANSACTION_BEFORE_COMMIT
      - AFTER_COMMIT_BEFORE_RESPONSE
  cleanup:
    enabled: true
    cron: "0 0 * * * *"
    batch-size: 100
    usage-retention: P90D
    advisory-lock-id: 904202609
  rate-limit:
    enabled: true
    anonymous:
      capacity: 200
      refill-tokens-per-second: 100.0
    login-ip:
      capacity: 20
      refill-tokens-per-second: 1.0
    login-username:
      capacity: 5
      refill-tokens-per-second: 0.2
    authenticated:
      capacity: 120
      refill-tokens-per-second: 60.0
    money-account:
      capacity: 20
      refill-tokens-per-second: 10.0
  account:
    default-limits:
      EUR:
        withdrawal: 1000.0000
        transfer: 1000.0000
      USD:
        withdrawal: 1000.0000
        transfer: 1000.0000
  manager-seed:
    managers:
      - username: ${TARBANK_MANAGER_USERNAME}
        password: ${TARBANK_MANAGER_PASSWORD}
        first-name: ${TARBANK_MANAGER_FIRST_NAME}
        last-name: ${TARBANK_MANAGER_LAST_NAME}
