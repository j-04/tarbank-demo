spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true

tarbank:
  cleanup:
    enabled: false
  rate-limit:
    anonymous:
      capacity: 100000
      refill-tokens-per-second: 100000.0
    login-ip:
      capacity: 100000
      refill-tokens-per-second: 100000.0
    login-username:
      capacity: 100000
      refill-tokens-per-second: 100000.0
    authenticated:
      capacity: 100000
      refill-tokens-per-second: 100000.0
    money-account:
      capacity: 100000
      refill-tokens-per-second: 100000.0
  jwt:
    issuer: tarbank-test
    signing-key: test-only-jwt-signing-key-must-not-be-used-outside-tests
  document-protection:
    key-version: v1
    encryption-key: test-only-document-encryption-key-must-not-be-used-outside-tests
    lookup-hmac-key: test-only-document-lookup-hmac-key-must-not-be-used-outside-tests
  idempotency:
    request-fingerprint-hmac-key: test-only-idempotency-fingerprint-key-must-not-be-used-outside-tests
  manager-seed:
    managers:
      - username: manager
        password: TestPass123!
        first-name: Test
        last-name: Manager
