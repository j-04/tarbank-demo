services:
  app:
    image: tarbank-demo:${TARBANK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: demo
      TARBANK_FAILURE_SIMULATOR_ENABLED: ${TARBANK_FAILURE_SIMULATOR_ENABLED:-true}
      TARBANK_FAILURE_SIMULATOR_FAILURE_RATE: ${TARBANK_FAILURE_SIMULATOR_FAILURE_RATE:-0.15}
      TARBANK_FAILURE_SIMULATOR_ALLOWED_POINTS: ${TARBANK_FAILURE_SIMULATOR_ALLOWED_POINTS:-BEFORE_TRANSACTION,DURING_TRANSACTION_BEFORE_COMMIT,AFTER_COMMIT_BEFORE_RESPONSE}
      TARBANK_RATE_LIMIT_ANONYMOUS_CAPACITY: ${TARBANK_RATE_LIMIT_ANONYMOUS_CAPACITY:-200}
      TARBANK_RATE_LIMIT_ANONYMOUS_REFILL_TOKENS_PER_SECOND: ${TARBANK_RATE_LIMIT_ANONYMOUS_REFILL_TOKENS_PER_SECOND:-100.0}
      TARBANK_RATE_LIMIT_LOGIN_IP_CAPACITY: ${TARBANK_RATE_LIMIT_LOGIN_IP_CAPACITY:-20}
      TARBANK_RATE_LIMIT_LOGIN_IP_REFILL_TOKENS_PER_SECOND: ${TARBANK_RATE_LIMIT_LOGIN_IP_REFILL_TOKENS_PER_SECOND:-1.0}
      TARBANK_RATE_LIMIT_LOGIN_USERNAME_CAPACITY: ${TARBANK_RATE_LIMIT_LOGIN_USERNAME_CAPACITY:-5}
      TARBANK_RATE_LIMIT_LOGIN_USERNAME_REFILL_TOKENS_PER_SECOND: ${TARBANK_RATE_LIMIT_LOGIN_USERNAME_REFILL_TOKENS_PER_SECOND:-0.2}
      TARBANK_RATE_LIMIT_AUTHENTICATED_CAPACITY: ${TARBANK_RATE_LIMIT_AUTHENTICATED_CAPACITY:-120}
      TARBANK_RATE_LIMIT_AUTHENTICATED_REFILL_TOKENS_PER_SECOND: ${TARBANK_RATE_LIMIT_AUTHENTICATED_REFILL_TOKENS_PER_SECOND:-60.0}
      TARBANK_RATE_LIMIT_MONEY_ACCOUNT_CAPACITY: ${TARBANK_RATE_LIMIT_MONEY_ACCOUNT_CAPACITY:-20}
      TARBANK_RATE_LIMIT_MONEY_ACCOUNT_REFILL_TOKENS_PER_SECOND: ${TARBANK_RATE_LIMIT_MONEY_ACCOUNT_REFILL_TOKENS_PER_SECOND:-10.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${TARBANK_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - tarbank

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${TARBANK_DATABASE_NAME:?Set TARBANK_DATABASE_NAME in .env}
      POSTGRES_USER: ${TARBANK_DATABASE_USERNAME:?Set TARBANK_DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${TARBANK_DATABASE_PASSWORD:?Set TARBANK_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tarbank

  redis:
    image: redis:7.4.2-alpine
    environment:
      REDIS_PASSWORD: ${TARBANK_REDIS_PASSWORD:?Set TARBANK_REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - tarbank

volumes:
  postgres-data:

networks:
  tarbank:
    driver: bridge
