services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - tarbank

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${TARBANK_DATABASE_NAME:?Set TARBANK_DATABASE_NAME in .env}
      POSTGRES_USER: ${TARBANK_DATABASE_USERNAME:?Set TARBANK_DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${TARBANK_DATABASE_PASSWORD:?Set TARBANK_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tarbank

  redis:
    image: redis:7.4.2-alpine
    environment:
      REDIS_PASSWORD: ${TARBANK_REDIS_PASSWORD:?Set TARBANK_REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - tarbank

volumes:
  postgres-data:

networks:
  tarbank:
    driver: bridge